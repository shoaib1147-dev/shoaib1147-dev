name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # runs once a day at midnight UTC
  workflow_dispatch: {}    # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main               # regenerates whenever you push to main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVG
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: shoaib1147-dev
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2370A5FD&color_dots=#2d333b,#39516e,#3f8bd4,#5aa8f5,#70A5FD
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%2370A5FD&color_dots=#2d333b,#39516e,#3f8bd4,#5aa8f5,#70A5FD

      - name: Push snake SVG to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
